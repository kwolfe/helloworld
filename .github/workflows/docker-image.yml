name: Build, Scan, and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-scan-push:
    name: Build, Scan, and Push
    runs-on: ubuntu-latest
    
    # Required permissions to upload scan results to the GitHub Security tab
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image locally
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v6
        with:
          context: .
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/helloworld:${{ github.sha }}

#      - name: Run Trivy vulnerability scanner
#        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
#        with:
#          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/helloworld:${{ github.sha }}'
#          format: 'sarif'
#          output: 'trivy-results.sarif'
#          severity: 'CRITICAL,HIGH'
#          exit-code: '1' # Fails the pipeline if CRITICAL or HIGH bugs are found

#      - name: Upload Trivy scan results to GitHub Security
#        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
#        if: always() # Ensures results upload even if the scanner fails the build
#        with:
#          sarif_file: 'trivy-results.sarif'

      - name: Push Docker Image to Docker Hub
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/helloworld:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/helloworld:latest
